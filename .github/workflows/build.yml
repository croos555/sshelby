name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --x64 --arm64
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    env:
      # macOS builds are unsigned for now (no Developer ID certificate)
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Windows: sign with the Certum cloud certificate on release tags when the secrets exist
      SIGN_WINDOWS: ${{ matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/v') && secrets.CERTUM_TOTP_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npx electron-vite build

      # ssign signs through Certum's cloud API (no SimplySign Desktop). Pinned release, checksum verified.
      - name: Install ssign
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ssign.zip"
          Invoke-WebRequest https://github.com/Le-Syl21/ssign/releases/download/v0.1.8/ssign-windows-x86_64.zip -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '89cbac647d19819a1a82645d2254ac51d2b34050835421294584385dadde1298') { throw "ssign checksum mismatch: $hash" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\ssign"
          "SSIGN_PATH=$env:RUNNER_TEMP\ssign\ssign.exe" >> $env:GITHUB_ENV

      # build/sign-win.js signs every exe (app, installer, uninstaller, portable) when the Certum secrets are set
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CERTUM_EMAIL: ${{ env.SIGN_WINDOWS == 'true' && secrets.CERTUM_USERNAME || '' }}
          CERTUM_OTP: ${{ env.SIGN_WINDOWS == 'true' && secrets.CERTUM_TOTP_SECRET || '' }}

      - name: Verify Windows signatures
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object FullName -match '\\x64\\' | Sort-Object FullName -Descending | Select-Object -First 1
          $files = @(Get-ChildItem dist -Filter *.exe) + (Get-Item dist/win-unpacked/Sshelby.exe)
          foreach ($f in $files) { & $signtool.FullName verify /pa /tw $f.FullName; if ($LASTEXITCODE) { exit 1 } }

      - uses: actions/upload-artifact@v4
        with:
          name: sshelby-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          # v1.2.3-rc.1 and similar are published as pre-releases
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
