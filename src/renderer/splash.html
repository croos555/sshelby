<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sshelby</title>
    <!-- Startup window shown while the main window loads (see app_ready in src-tauri/src/lib.rs) -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      .card {
        width: 340px;
        height: 360px;
        box-sizing: border-box;
        border-radius: 22px;
        background: linear-gradient(180deg, #1d3c63 0%, #0d1b2e 100%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #e7e9ee;
        animation: in 0.35s ease-out both;
      }
      img {
        width: 130px;
        height: 149px;
        margin-bottom: 14px;
        filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.35));
      }
      h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.3px;
      }
      p {
        margin: 6px 0 22px;
        font-size: 12px;
        color: #9fb2c8;
      }
      .bar {
        width: 160px;
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      .bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #21d07a;
        animation: slide 1.1s ease-in-out infinite;
      }
      .ver {
        position: absolute;
        bottom: 28px;
        font-size: 10px;
        color: #6c809a;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: scale(0.96);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body data-tauri-drag-region>
    <div class="card" data-tauri-drag-region>
      <img src="./splash-mark.svg" alt="" />
      <h1>Sshelby</h1>
      <p>SSH · SFTP · Port forwarding</p>
      <div class="bar"><span></span></div>
    </div>
    <div class="ver">v%VITE_APP_VERSION%</div>
  </body>
</html>
