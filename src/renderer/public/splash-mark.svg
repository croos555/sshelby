<svg xmlns="http://www.w3.org/2000/svg" viewBox="250 200 524 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3c63"/>
      <stop offset="1" stop-color="#0d1b2e"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e6f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824px squircle inset 100px -->
  
  

  <g filter="url(#shadow)">
    <!-- hinge ears, drawn first so the fan overlaps them -->
    <path fill="#c9d9e8" d="M 432 694 Q 512 684 592 694 L 584 744 Q 512 758 440 744 Z"/>
    <!-- scallop shell: fan with a scalloped top edge, hinge at the bottom -->
    <path fill="url(#shell)" d="
      M 512 742
      L 300 560
      C 262 470 280 380 330 322
      Q 352 282 392 290
      Q 418 250 452 262
      Q 482 230 512 236
      Q 542 230 572 262
      Q 606 250 632 290
      Q 672 282 694 322
      C 744 380 762 470 724 560
      Z"/>
  </g>

  <!-- ridges radiating from the hinge -->
  <g stroke="#9fb6cc" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.75">
    <path d="M 512 724 L 352 330"/>
    <path d="M 512 724 L 420 280"/>
    <path d="M 512 724 L 512 262"/>
    <path d="M 512 724 L 604 280"/>
    <path d="M 512 724 L 672 330"/>
  </g>

  <!-- terminal prompt on the shell -->
  <rect x="386" y="420" width="252" height="168" rx="28" fill="#0f1f33"/>
  <path d="M 428 468 L 476 504 L 428 540" fill="none" stroke="#21d07a" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="500" y="526" width="96" height="22" rx="8" fill="#21d07a"/>
</svg>
